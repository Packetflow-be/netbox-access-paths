{% load i18n %}
{% if permitted %}
  <div class="list-group list-group-flush">
    {% for title, count, url in rows %}
      <a href="{{ url }}" class="list-group-item list-group-item-action px-1 py-2">
        <div class="d-flex w-100 justify-content-between align-items-center">
          {{ title }}
          <span class="badge {% if count %}text-bg-warning{% else %}text-bg-success{% endif %}">{{ count }}</span>
        </div>
      </a>
    {% endfor %}
    <a href="{{ review_url }}" class="list-group-item list-group-item-action px-1 py-2 text-secondary">
      <i class="mdi mdi-clipboard-check-outline"></i> {% trans "Open the review queue" %}
    </a>
  </div>
{% else %}
  <div class="text-secondary text-center py-3"><i class="mdi mdi-lock-outline"></i> {% trans "No permission" %}</div>
{% endif %}
