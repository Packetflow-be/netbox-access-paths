name: Bug report
description: Something doesn't work as the README says
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: netbox
    attributes:
      label: NetBox version
      placeholder: 4.7.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Leave customer names and credentials out.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
      description: Include the traceback if there is one.
    validations:
      required: true
